; Merge into the official [www] pool. clear_env=no is required so Render
; dashboard variables (APP_KEY, DB_*) reach Laravel inside PHP-FPM workers.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 60
